name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testthat:
    name: testthat (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Run the long suites too: Monte Carlo invariants and the integration grid.
      NOT_CRAN: true
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Reads TNAModule/DESCRIPTION (tna, cograph and codyna pinned by commit in
      # Remotes) and installs all dependencies via pak, plus testthat, pkgload,
      # igraph and yaml: the tests load the module from source, compare it with
      # independent references and read its .yaml definitions.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: TNAModule
          extra-packages: |
            any::testthat
            any::pkgload
            any::igraph
            any::yaml

      - name: Run testthat regression, equivalence and integration suites
        working-directory: TNAModule
        run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
