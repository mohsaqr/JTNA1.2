name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testthat:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Reads TNAModule/DESCRIPTION (incl. Remotes: tna@main, codyna@dev) and
      # installs all dependencies via pak, plus testthat for the test runner.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: TNAModule
          extra-packages: any::testthat

      - name: Run testthat regression + equivalence suite
        working-directory: TNAModule
        run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
