                    - centrality_OutStrength
                    - centrality_InStrength
                    - centrality_ClosenessIn
                    - centrality_ClosenessOut
                    - centrality_Closeness
                    - centrality_Betweenness
                    - centrality_BetweennessRSP
                    - centrality_Diffusion
                    - centrality_Clustering
            -   name: plot
