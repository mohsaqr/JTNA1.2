---
name: TNA
title: Transition Network Analysis
jrs: '1.1'
refs:
    - JTNA
    - TNA
    - TNALAK
    - CODYNA
items:
    -   name: instructions
        title: Instructions
        type: Html
        visible: false
    -   name: modelCache
        type: Preformatted
        visible: false
        clearWith:
            - buildModel_variables_long_action
            - buildModel_variables_long_actor
            - buildModel_variables_long_time
            - buildModel_variables_long_order
            - buildModel_type
            - buildModel_scaling
            - buildModel_threshold
            - buildModel_lambda
    -   name: model
        title: Transition Model
        type: Group
        items:
            -   name: matrix
                title: Transition Matrix
                type: Table
                visible: (buildModel_show_matrix)
                rows: 0
                columns:
                    -   name: from
                        title: From
                        type: text
                clearWith:
                    - buildModel_variables_long_action
                    - buildModel_variables_long_actor
                    - buildModel_variables_long_time
                    - buildModel_variables_long_order
                    - buildModel_type
                    - buildModel_scaling
                    - buildModel_threshold
                    - buildModel_lambda
            -   name: inits
                title: Initial Probabilities
                type: Table
                visible: (buildModel_show_matrix)
                rows: 0
                columns:
                    -   name: state
                        title: State
                        type: text
                    -   name: prob
                        title: Probability
                        type: number
                clearWith:
                    - buildModel_variables_long_action
                    - buildModel_variables_long_actor
                    - buildModel_variables_long_time
                    - buildModel_variables_long_order
                    - buildModel_type
                    - buildModel_scaling
                    - buildModel_threshold
                    - buildModel_lambda
            -   name: plot
                title: Network
                type: Image
                width: 600
                height: 600
                visible: (buildModel_show_plot)
                renderFun: .showModelPlot
                clearWith:
                    - buildModel_variables_long_action
                    - buildModel_variables_long_actor
                    - buildModel_variables_long_time
                    - buildModel_variables_long_order
                    - buildModel_type
                    - buildModel_scaling
                    - buildModel_threshold
                    - buildModel_lambda
                    - buildModel_plot_cut
                    - buildModel_plot_min_value
                    - buildModel_plot_edge_label_size
                    - buildModel_plot_node_size
                    - buildModel_plot_node_label_size
                    - buildModel_plot_layout
            -   name: histogram
                title: Edge Weights
                type: Image
                width: 600
                height: 600
                visible: (buildModel_show_histo)
                renderFun: .showModelHistogram
                clearWith:
                    - buildModel_variables_long_action
                    - buildModel_variables_long_actor
                    - buildModel_variables_long_time
                    - buildModel_variables_long_order
                    - buildModel_type
                    - buildModel_scaling
                    - buildModel_threshold
                    - buildModel_lambda
            -   name: frequencies
                title: State Frequencies
                type: Image
                width: 600
                height: 600
                visible: (buildModel_show_frequencies)
                renderFun: .showModelFrequencies
                clearWith:
                    - buildModel_variables_long_action
                    - buildModel_variables_long_actor
                    - buildModel_variables_long_time
                    - buildModel_variables_long_order
                    - buildModel_type
                    - buildModel_scaling
                    - buildModel_threshold
                    - buildModel_lambda
