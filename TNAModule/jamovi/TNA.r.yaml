                        type: number
                        visible: (centrality_ClosenessIn)
                    -   name: ClosenessOut
                        title: Closeness (out)
                        type: number
                        visible: (centrality_ClosenessOut)
                    -   name: Closeness
                        title: Closeness
                        type: number
                        visible: (centrality_Closeness)
                    -   name: Betweenness
                        title: Betweenness
                        type: number
                        visible: (centrality_Betweenness)
